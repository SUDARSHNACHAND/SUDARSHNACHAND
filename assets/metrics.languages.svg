<svg xmlns="http://www.w3.org/2000/svg" width="480" height="165" viewBox="0 0 480 165" fill="none">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="480" height="165" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="32" fill="#aa9bef" font-size="14" font-weight="600">Most Used Languages</text>
  
  <!-- Language bars / breakdown -->
  <g transform="translate(24, 52)">
    <rect width="432" height="10" rx="5" fill="#21262d"/>
    <rect x="0" width="160" height="10" rx="5" fill="#3178c6"/> <!-- TypeScript -->
    <rect x="162" width="120" height="10" rx="5" fill="#3572A5"/> <!-- Python -->
    <rect x="284" width="90" height="10" rx="5" fill="#f1e05a"/> <!-- JavaScript -->
    <rect x="376" width="56" height="10" rx="5" fill="#e34c26"/> <!-- HTML/CSS -->
  </g>

  <!-- Legend -->
  <g transform="translate(24, 85)">
    <!-- TypeScript -->
    <circle cx="6" cy="6" r="5" fill="#3178c6"/>
    <text x="18" y="10" fill="#c9d1d9" font-size="12">TypeScript</text>
    <text x="90" y="10" fill="#8b949e" font-size="12">37%</text>

    <!-- Python -->
    <circle cx="150" cy="6" r="5" fill="#3572A5"/>
    <text x="162" y="10" fill="#c9d1d9" font-size="12">Python</text>
    <text x="215" y="10" fill="#8b949e" font-size="12">28%</text>

    <!-- JavaScript -->
    <circle cx="270" cy="6" r="5" fill="#f1e05a"/>
    <text x="282" y="10" fill="#c9d1d9" font-size="12">JavaScript</text>
    <text x="350" y="10" fill="#8b949e" font-size="12">21%</text>

    <!-- Other -->
    <circle cx="6" cy="36" r="5" fill="#e34c26"/>
    <text x="18" y="40" fill="#c9d1d9" font-size="12">Other / Web</text>
    <text x="90" y="40" fill="#8b949e" font-size="12">14%</text>
  </g>
</svg>
