<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="480" height="160" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="24" y="38" fill="#1a7f37" font-size="16" font-weight="600">GitHub Statistics</text>
  
  <g transform="translate(24, 72)">
    <text x="0" y="0" fill="#57606a" font-size="13">Public Repos</text>
    <text x="0" y="32" fill="#1f2328" font-size="24" font-weight="700">6</text>
  </g>
  
  <g transform="translate(150, 72)">
    <text x="0" y="0" fill="#57606a" font-size="13">Total Stars</text>
    <text x="0" y="32" fill="#1f2328" font-size="24" font-weight="700">0</text>
  </g>
  
  <g transform="translate(260, 72)">
    <text x="0" y="0" fill="#57606a" font-size="13">Forks</text>
    <text x="0" y="32" fill="#1f2328" font-size="24" font-weight="700">0</text>
  </g>
  
  <g transform="translate(360, 72)">
    <text x="0" y="0" fill="#57606a" font-size="13">Followers</text>
    <text x="0" y="32" fill="#1f2328" font-size="24" font-weight="700">1</text>
  </g>
</svg>